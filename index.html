function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function unlockAudio() {
  try {
    const ctx = getCtx();
    const buf = ctx.createBuffer(1,1,22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
  } catch(e) {}
  const a = new Audio(MUSIC_URL);
  a.volume = 0;
  a.play().then(() => { a.pause(); }).catch(() => {});
  document.getElementById('sound-btn').textContent = '🔊 Suara Aktif!';
  document.getElementById('sound-btn').classList.add('active');
}
function startBGM() {
  stopBGM();
  bgm = new Audio(MUSIC_URL);
  bgm.loop = true; bgm.volume = 0.5;
  const p = bgm.play();
  if (p) p.catch(() => {});
}
function stopBGM() {
  if (bgm) { bgm.pause(); bgm.currentTime = 0; bgm = null; }
}
function playBeep(freq, type, vol, dur) {
  try {
    const ctx = getCtx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; o.type = type;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playTimeoutSound() { stopBGM(); [880,660,440,330].forEach((f,i) => setTimeout(() => playBeep(f,'square',0.3,0.15), i*180)); }
function playCorrectSound() { stopBGM(); [523,659,784].forEach((f,i) => setTimeout(() => playBeep(f,'sine',0.2,0.1), i*120)); }
function playWrongSound() { stopBGM(); playBeep(220,'sawtooth',0.2,0.4); }
function playReadingBeep() { playBeep(660,'sine',0.08,0.08); }

    if (ph) { ph.textContent = 'Jawab sekarang!'; ph.className = 'phase-label running'; }
  }
}
function setOptions(locked) {

      <div style="display:flex;align-items:center;gap:8px;">

        <span class="timer-box reading" id="timer-box">👁 ${READ_TIME}s</span>
      </div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="question-text">${q.q}</div>
    <div class="options-grid">
      ${q.options.map((opt,i)=>`<button class="option-btn locked" id="opt-${i}" onclick="choose(${i})" disabled>${opt}</button>`).join('')}
    </div>
    <div id="feedback"></div>
    <div class="nav-row" id="nav"></div>`;
  startReadingPhase();
}
function choose(idx) {
  if (selected !== null || phase === 'reading') return;
  stopTimer(); stopBGM(); selected = idx;
  const q = questions[current], isCorrect = idx === q.answer;
  if (isCorrect) { score++; playCorrectSound(); } else { playWrongSound(); }
  userAnswers.push({ q: q.q, chosen: q.options[idx], correct: q.options[q.answer], isCorrect });
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById('opt-'+i); btn.disabled = true;
    if (i === q.answer) btn.classList.add(idx===i?'correct':'reveal-correct');
    else if (i===idx && !isCorrect) btn.classList.add('wrong');
  }
  document.getElementById('feedback').innerHTML = `<div class="feedback-box ${isCorrect?'correct':'wrong'}"><i class="ti ${isCorrect?'ti-circle-check':'ti-circle-x'}"></i><div><strong>${isCorrect?'Benar!':'Kurang tepat.'}</strong> ${q.explanation}</div></div>`;
  const isLast = current === questions.length - 1;
  document.getElementById('nav').innerHTML = `<button class="next-btn" onclick="next()">${isLast?'Lihat Hasil':'Soal Berikutnya'} <i class="ti ti-arrow-right"></i></button>`;
}
function next() { current++; render(); }
function renderResult() {
  const pct = Math.round((score/questions.length)*100);
  const verdict = pct===100?"Sempurna! 🎉":pct>=80?"Bagus Sekali! 👏":pct>=60?"Cukup Bagus! 👍":"Tetap Semangat! 💪";
  root.innerHTML = `
    <div class="result-wrap">
      <div class="score-circle"><span class="score-num">${score}/${questions.length}</span><span class="score-label">${pct}%</span></div>
      <div class="result-title">${verdict}</div>
      <div style="font-weight:700;color:#15803d;margin-bottom:8px;">${subjectInfo[activeSubject].name}</div>
      <div class="result-sub">Kamu menjawab ${score} dari ${questions.length} soal dengan benar.</div>
      <div class="result-answers">
        ${userAnswers.map(a=>`<div class="ans-item">
          <i class="ans-icon ti ${a.isCorrect?'ti-circle-check':'ti-circle-x'}" style="color:${a.isCorrect?'#16a34a':'#dc2626'}"></i>
          <div><div class="ans-q">${a.q}</div>
          <div>${a.isCorrect?`<span style="color:#16a34a">${a.correct}</span>`:`<span style="color:#dc2626;text-decoration:line-through">${a.chosen}</span> → <span style="color:#16a34a">${a.correct}</span>`}</div>
          </div></div>`).join('')}
      </div>
      <button class="restart-btn" onclick="startQuiz()"><i class="ti ti-refresh"></i> Ulangi Materi</button> <button class="restart-btn" style="margin-top:8px;background:#166534;" onclick="renderIntro()"><i class="ti ti-books"></i> Pilih Materi Lain</button>
    </div>`;
}

// =====================================
// NEON DODGE X MINI-GAME (integrated)
// Fixed pointer handler syntax, scoped state,
// and a single animation-frame loop per launch.
// =====================================
let miniRaf = 0;
let miniActive = false;
let miniCleanup = [];

function launchMinigame() {
  stopTimer();
  stopBGM();
  miniActive = true;
  root.innerHTML = document.getElementById('minigame-template').innerHTML;
  initNeonDodge();
}

function exitMinigame() {
  miniActive = false;
  if (miniRaf) cancelAnimationFrame(miniRaf);
  miniRaf = 0;
  miniCleanup.forEach(fn => { try { fn(); } catch (_) {} });
  miniCleanup = [];
  input.left = false;
  input.right = false;
  input.dragging = false;
  renderIntro();
}

function initNeonDodge() {
  const canvas = document.getElementById('mini-game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const $ = id => document.getElementById(id);
  const ui = {
    score: $('mini-score'), level: $('mini-level'), coins: $('mini-coins'),
    best: $('mini-best'), overlay: $('mini-overlay'),
    overlayTitle: $('mini-overlay-title'), overlayText: $('mini-overlay-text'),
    finalScore: $('mini-final-score'), details: $('mini-overlay-details'),
    pause: $('mini-pause')
  };
  let player, blocks = [], coins = [], particles = [], stars = [];
  let score = 0, collected = 0, level = 1, elapsed = 0;
  let blockTimer = .7, coinTimer = 1.3, bgOffset = 0;
  let gameState = 'playing', last = 0, raf = 0;
  let left = false, right = false, dragging = false;
  let best = 0;
  try { best = Number(localStorage.getItem('neonDodgeBest')) || 0; } catch (_) {}
  ui.best.textContent = best;

  function reset() {
    player = { x: W / 2 - 16, y: H - 93, w: 32, h: 38, speed: 300 };
    blocks = []; coins = []; particles = [];
    score = 0; collected = 0; level = 1; elapsed = 0;
    blockTimer = .65; coinTimer = 1.2; bgOffset = 0;
    left = right = dragging = false;
    gameState = 'playing'; last = 0;
    ui.overlay.classList.add('hidden');
    ui.pause.textContent = 'Ⅱ PAUSE';
    updateHUD();
  }
  function updateHUD() {
    ui.score.textContent = Math.floor(score);
    ui.level.textContent = level;
    ui.coins.textContent = collected;
  }
  function spawnBlock() {
    const size = 24 + Math.random() * 28;
    blocks.push({ x: 8 + Math.random() * (W - size - 16), y: -size - 5,
      w: size, h: size, speed: 175 + Math.random() * 75 + level * 15,
      angle: Math.random() * .2, rotation: (Math.random() - .5) * 2.2 });
  }
  function spawnCoin() {
    coins.push({ x: 20 + Math.random() * (W - 40), y: -25, r: 10,
      speed: 145 + level * 8, phase: Math.random() * Math.PI * 2 });
  }
  function rectHit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
      a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function circleHit(c, r) {
    const nx = Math.max(r.x, Math.min(c.x, r.x + r.w));
    const ny = Math.max(r.y, Math.min(c.y, r.y + r.h));
    const dx = c.x - nx, dy = c.y - ny;
    return dx * dx + dy * dy < c.r * c.r;
  }
  function burst(x, y, color, amount = 12) {
    for (let i = 0; i < amount; i++) {
      const a = Math.random() * Math.PI * 2, speed = Math.random() * 170 + 40;
      particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        life: .4 + Math.random() * .55, maxLife: .95, size: Math.random() * 4 + 2, color });
    }
  }
  function endGame() {
    if (gameState === 'gameover') return;
    gameState = 'gameover';
    const final = Math.floor(score);
    if (final > best) {
      best = final; ui.best.textContent = best;
      try { localStorage.setItem('neonDodgeBest', String(best)); } catch (_) {}
    }
    ui.overlayTitle.textContent = 'GAME OVER';
    ui.overlayText.textContent = 'Badai neon berhasil menghentikanmu.';
    ui.finalScore.textContent = final + ' POINTS';
    ui.details.textContent = 'Level ' + level + ' • ' + collected + ' koin terkumpul';
    ui.overlay.classList.remove('hidden');
    ui.pause.textContent = 'Ⅱ PAUSE';
  }
  function update(dt) {
    if (gameState !== 'playing') return;
    elapsed += dt; score += dt * 12; level = Math.floor(score / 180) + 1;
    if (left) player.x -= player.speed * dt;
    if (right) player.x += player.speed * dt;
    player.x = Math.max(4, Math.min(W - player.w - 4, player.x));
    bgOffset = (bgOffset + 25 * dt) % 40;
    stars.forEach(s => { s.y += s.speed * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } });
    blockTimer -= dt;
    if (blockTimer <= 0) {
      spawnBlock();
      blockTimer = Math.max(.27, .78 - level * .035) * (.75 + Math.random() * .5);
    }
    coinTimer -= dt;
    if (coinTimer <= 0) { spawnCoin(); coinTimer = 1.3 + Math.random() * 1.2; }
    for (let i = blocks.length - 1; i >= 0; i--) {
      const b = blocks[i]; b.y += b.speed * dt; b.angle += b.rotation * dt;
      if (rectHit(player, b)) { burst(player.x + player.w / 2, player.y + player.h / 2, '#ff316f', 28); endGame(); return; }
      if (b.y > H + 60) blocks.splice(i, 1);
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i]; c.y += c.speed * dt; c.phase += dt * 5;
      if (circleHit(c, player)) { collected++; score += 30; burst(c.x, c.y, '#ffe66d', 14); coins.splice(i, 1); continue; }
      if (c.y > H + 40) coins.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= Math.max(0, 1 - dt * 1.4); p.vy *= Math.max(0, 1 - dt * 1.4); p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    updateHUD();
  }
  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#080d24'); g.addColorStop(.5, '#080a1b'); g.addColorStop(1, '#030612');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.strokeStyle = '#132448'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 42) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = -40 + bgOffset; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
    for (const s of stars) { ctx.globalAlpha = s.alpha; ctx.fillStyle = '#b8d8ff'; ctx.fillRect(s.x, s.y, s.size, s.size); }
    ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(0,245,255,.45)'; ctx.fillRect(0, 0, 2, H); ctx.fillRect(W - 2, 0, 2, H);
    for (const c of coins) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1 + Math.sin(c.phase) * .1, 1 + Math.sin(c.phase) * .1);
      ctx.shadowColor = '#ffe66d'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffe66d';
      ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff8c5'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#946900'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, 1); ctx.restore();
    }
    for (const b of blocks) {
      ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.rotate(b.angle);
      ctx.shadowColor = '#ff316f'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff244f';
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.strokeStyle = '#ffb3c5'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
      ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 9; ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if (gameState !== 'gameover') {
      const cx = player.x + player.w / 2, flame = 7 + Math.random() * 8;
      ctx.save(); ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff8b32';
      ctx.beginPath(); ctx.moveTo(cx - 7, player.y + player.h - 4); ctx.lineTo(cx, player.y + player.h + flame); ctx.lineTo(cx + 7, player.y + player.h - 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#00f5ff'; ctx.strokeStyle = '#c9ffff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, player.y); ctx.lineTo(player.x + player.w, player.y + player.h); ctx.lineTo(cx, player.y + player.h - 9); ctx.lineTo(player.x, player.y + player.h); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 7; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(cx, player.y + 12); ctx.lineTo(cx + 5, player.y + 24); ctx.lineTo(cx - 5, player.y + 24); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    if (gameState === 'paused') {
      ctx.fillStyle = '#02051099'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#00f5ff'; ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 18; ctx.font = 'bold 34px Arial'; ctx.fillText('PAUSED', W / 2, H / 2);
      ctx.shadowBlur = 0; ctx.fillStyle = '#c3d2ff'; ctx.font = '14px Arial'; ctx.fillText('Tekan LANJUT untuk bermain', W / 2, H / 2 + 40);
    }
  }
  function loop(timestamp) {
    if (!miniActive || !document.getElementById('mini-game')) return;
    const dt = last ? Math.min((timestamp - last) / 1000, .032) : 0;
    last = timestamp;
    if (gameState === 'playing') update(dt);
    else if (gameState === 'gameover') {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    draw();
    raf = requestAnimationFrame(loop);
    miniRaf = raf;
  }
  function togglePause() {
    if (gameState === 'playing') { gameState = 'paused'; left = right = false; ui.pause.textContent = '▶ LANJUT'; }
    else if (gameState === 'paused') { gameState = 'playing'; last = 0; ui.pause.textContent = 'Ⅱ PAUSE'; }
  }
  function bindMove(id, dir) {
    const btn = $(id);
    const down = e => {
      e.preventDefault(); if (gameState !== 'playing') return;
      if (dir === 'left') left = true; else right = true;
      btn.classList.add('active');
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const up = e => {
      if (dir === 'left') left = false; else right = false;
      btn.classList.remove('active');
      if (e) { try { if (btn.hasPointerCapture(e.pointerId)) btn.releasePointerCapture(e.pointerId); } catch (_) {} }
    };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('lostpointercapture', up);
    miniCleanup.push(() => {
      btn.removeEventListener('pointerdown', down); btn.removeEventListener('pointerup', up);
      btn.removeEventListener('pointercancel', up); btn.removeEventListener('lostpointercapture', up);
    });
  }
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width }; };
  const dragStart = e => {
    if (gameState !== 'playing') return; e.preventDefault(); dragging = true;
    player.x = Math.max(0, Math.min(W - player.w, pos(e).x - player.w / 2));
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const dragMove = e => {
    if (!dragging || gameState !== 'playing') return; e.preventDefault();
    player.x = Math.max(0, Math.min(W - player.w, pos(e).x - player.w / 2));
  };
  const dragEnd = () => { dragging = false; };
  const keyDown = e => {
    if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') left = true;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') right = true;
    if (e.key === ' ' && !e.repeat) togglePause();
    if (e.key.toLowerCase() === 'r' && !e.repeat) reset();
  };
  const keyUp = e => {
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') left = false;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') right = false;
  };
  const blur = () => { left = right = dragging = false; };
  const pauseClick = () => togglePause();
  const resetClick = () => reset();
  const playAgain = () => reset();
  canvas.addEventListener('pointerdown', dragStart);
  canvas.addEventListener('pointermove', dragMove);
  canvas.addEventListener('pointerup', dragEnd);
  canvas.addEventListener('pointercancel', dragEnd);
  canvas.addEventListener('lostpointercapture', dragEnd);
  document.addEventListener('keydown', keyDown);
  document.addEventListener('keyup', keyUp);
  window.addEventListener('blur', blur);
  ui.pause.addEventListener('click', pauseClick);
  $('mini-reset').addEventListener('click', resetClick);
  $('mini-play-again').addEventListener('click', playAgain);
  miniCleanup.push(() => {
    canvas.removeEventListener('pointerdown', dragStart); canvas.removeEventListener('pointermove', dragMove);
    canvas.removeEventListener('pointerup', dragEnd); canvas.removeEventListener('pointercancel', dragEnd);
    canvas.removeEventListener('lostpointercapture', dragEnd);
    document.removeEventListener('keydown', keyDown); document.removeEventListener('keyup', keyUp);
    window.removeEventListener('blur', blur);
    ui.pause.removeEventListener('click', pauseClick);
    $('mini-reset')?.removeEventListener('click', resetClick);
    $('mini-play-again')?.removeEventListener('click', playAgain);
  });
  bindMove('mini-left', 'left'); bindMove('mini-right', 'right');
  stars = Array.from({length:65}, () => ({
    x: Math.random() * W, y: Math.random() * H, size: Math.random() * 2 + .5,
    speed: Math.random() * 24 + 8, alpha: Math.random() * .6 + .2
  }));
  reset();
  draw();
  miniRaf = requestAnimationFrame(loop);
}

renderIntro();
</script>
</body>
</html>
